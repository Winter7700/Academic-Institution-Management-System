<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Student Details - MIT ADT University Pune</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Search Student Details</h1>
    </header>

    <form id="searchForm">
        <label for="searchId">Enter Student ID:</label>
        <input type="text" id="searchId" name="searchId" required>
        <button type="submit">Search</button>
    </form>

    <div id="studentDetails">
        <!-- Student details will appear here after search -->
    </div>

    <footer>
        <p>Academic Institution Management System</p>
    </footer>
</body>
</html>
