<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Student Details - MIT ADT University Pune</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Insert Student Details</h1>
    </header>

    <form id="insertForm">
        <label for="id">Student ID:</label>
        <input type="text" id="id" name="id" required>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <label for="dob">Date of Birth:</label>
        <input type="text" id="dob" name="dob" required>
        <label for="yearOfPassing">Year of Passing:</label>
        <input type="text" id="yearOfPassing" name="yearOfPassing" required>
        <label for="phoneNumber">Phone Number:</label>
        <input type="text" id="phoneNumber" name="phoneNumber" required>
        <label for="feesStatus">Fees Status:</label>
        <input type="text" id="feesStatus" name="feesStatus" required>
        <button type="submit">Submit</button>
    </form>

    <footer>
        <p>Academic Institution Management System</p>
    </footer>
</body>
</html>
